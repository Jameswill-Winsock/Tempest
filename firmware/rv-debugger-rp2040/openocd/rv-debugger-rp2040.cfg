# OpenOCD adapter configuration for RV-Debugger-RP2040
#
# The firmware emulates an FT2232D exactly like the Sipeed RV-Debugger-BL702,
# so the stock ftdi driver works unchanged.
#
#   openocd -f openocd/rv-debugger-rp2040.cfg -f target/<your_target>.cfg

adapter driver ftdi

ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# Product string is "JTAG Debugger" unless you built with
# -DFTDI_PRODUCT_GOWIN_CABLE=ON (then it is "Gowin USB2.0 Debug Cable").
# Leave commented out if you only have one FTDI device attached.
#ftdi device_desc "JTAG Debugger"

# ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS.
# data 0x0008 = TMS high, direction 0x000b = TCK/TDI/TMS outputs.
ftdi layout_init 0x0008 0x000b

# The firmware ignores the MPSSE "set clock divisor" command (0x86) exactly
# like the BL702 original: TCK is fixed by the JTAG_TCK_DELAY build option.
# This line only keeps OpenOCD happy - it does not change the real clock.
adapter speed 4000

transport select jtag
